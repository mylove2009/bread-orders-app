@media print{

}

function recalculateSelectedHistory(){

 }

function applyArchivePrintColumns(){
 const table=oaContent.querySelector('.customer-month-prices');if(!table)return;
 // Keep the source table intact; build a print-only table so colspan summary rows
 // do not shift the positions of the selected columns.
 const clone=table.cloneNode(true);
 const chosen=oaPrintSelection.slice().sort((a,b)=>a-b);
 clone.querySelectorAll('tr').forEach(tr=>{
  const original=[...tr.children],expanded=[];
  original.forEach(cell=>{const span=Math.max(1,Number(cell.getAttribute('colspan'))||1);for(let k=0;k<span;k++)expanded.push(k===0?cell.textContent.trim():'')});
  tr.innerHTML='';chosen.forEach(i=>{const el=document.createElement(tr.parentElement.tagName==='THEAD'?'th':'td');el.textContent=expanded[i]||'';if(tr.classList.contains('orders-paid')&&expanded[i].includes('Alter Saldo')){el.style.color='#d00000';el.style.fontWeight='900'}tr.appendChild(el)});
 });
 // Keep the summary visible across all selected columns without relying on old colspans.
 const body=clone.tBodies[0];
 if(body){
  [...body.rows].filter(r=>r.classList.contains('orders-paid')||r.classList.contains('orders-rest')).forEach(r=>{
   const srcRows=[...table.tBodies[0].rows];const src=srcRows[[...body.rows].indexOf(r)];
   if(!src)return;
   const cells=[...src.cells];const label=cells[0]?.textContent.trim()||'';
   const value=cells[1]?.textContent.trim()||'';
   r.innerHTML='';
   const labelCell=document.createElement('td');labelCell.textContent=label;labelCell.colSpan=Math.max(1,chosen.length-1);
   const valueCell=document.createElement('td');valueCell.textContent=value;
   if(chosen.length===1){labelCell.textContent=label+' : '+value;r.appendChild(labelCell)}
   else{r.append(labelCell,valueCell)}
   if(label.includes('Alter Saldo')){r.style.color='#d00000';r.style.fontWeight='900'}
  });
 }
 clone.id='oaPrintOnlyTable';
 // Fit the printable width while allocating space proportionally to actual column content.
 const columnCount=chosen.length;
 const measureCanvas=document.createElement('canvas');
 const measureCtx=measureCanvas.getContext('2d');
 measureCtx.font='bold 10px Arial';
 const weights=Array.from({length:columnCount},(_,i)=>{
  let longest=0;
  [...clone.rows].forEach(row=>{
   const cell=row.cells[i];
   if(!cell||cell.colSpan>1)return;
   longest=Math.max(longest,measureCtx.measureText((cell.textContent||'').trim()).width);
  });
  return Math.max(35,Math.min(310,longest+16));
 });
 const sum=weights.reduce((a,b)=>a+b,0)||1;
 const cg=document.createElement('colgroup');
 weights.forEach(w=>{const col=document.createElement('col');col.style.width=(100*w/sum).toFixed(4)+'%';cg.appendChild(col)});
 clone.insertBefore(cg,clone.firstChild);
 clone.style.width='100%';clone.style.maxWidth='100%';clone.style.tableLayout='fixed';
 table.style.display='none';table.insertAdjacentElement('afterend',clone);
}

}

function setDriverZoom(value){
 const viewport=document.getElementById('driverImageViewport');
 const frame=document.getElementById('driverImageZoomFrame');
 const sheet=document.getElementById('driverImageSheet');
 if(!viewport||!frame||!sheet)return;
 const oldZoom=driverZoom;
 const oldCenterX=viewport.scrollLeft+viewport.clientWidth/2;
 const oldCenterY=viewport.scrollTop+viewport.clientHeight/2;
 driverZoom=Math.max(.5,Math.min(3,Number(value)||.5));
 // Measure the real, unscaled content instead of the old frame's width.
 sheet.style.transform='none';sheet.style.zoom='1';
 const naturalWidth=sheet.offsetWidth,naturalHeight=sheet.offsetHeight;
 frame.style.width=Math.ceil(naturalWidth*driverZoom)+'px';
 frame.style.height=Math.ceil(naturalHeight*driverZoom)+'px';
 sheet.style.transformOrigin='0 0';
 sheet.style.transform='scale('+driverZoom+')';
 const label=document.getElementById('driverZoomValue');
 if(label)label.textContent=Math.round(driverZoom*100)+'%';
 requestAnimationFrame(()=>{
  // First opening/reset always centers the image. Further zooms retain the visible center.
  if(value===.5){viewport.scrollLeft=Math.max(0,(viewport.scrollWidth-viewport.clientWidth)/2);viewport.scrollTop=0;return}
  const ratio=driverZoom/oldZoom;
  viewport.scrollLeft=Math.max(0,(oldCenterX-viewport.clientWidth/2)*ratio+(viewport.scrollWidth-viewport.clientWidth>0?viewport.clientWidth*(ratio-1)/2:0));
  viewport.scrollTop=Math.max(0,oldCenterY*ratio-viewport.clientHeight/2);

  if(e.touches.length===2){startDistance=distance(e);startZoom=driverZoom;e.preventDefault()}

 m.country=document.getElementById('profileCountry').value;document.querySelectorAll('[data-profile]').forEach(el=>{let k=el.dataset.profile;m[k]=PRICE_KEYS.includes(k)?Math.max(0,Number(el.value)||0):el.value.trim()});

// The previous-day balance is derived from chronological order history. A manual correction
// is stored as an explicit opening balance for that day, so later days recompute automatically.
function crateDay(p,d){let r=p.days?.[d];return r||null}
function crateDelivered(p,d){let r=crateDay(p,d);return r?['small','large','brown','tannour'].reduce((n,k)=>n+Math.max(0,Number(r[k])||0),0):0}
function cratePrevious(p,d){let dates=Object.keys(p.days||{}).filter(x=>x<d).sort();let balance=0;for(let x of dates){let r=p.days[x];if(r.crateOpening!==undefined&&r.crateOpening!==null&&r.crateOpening!=='')balance=Number(r.crateOpening)||0;balance-=Math.max(0,Number(r.crateCollected)||0);balance+=crateDelivered(p,x)}return balance}
function crateBalance(p,d){let r=crateDay(p,d)||{};let prev=r.crateOpening!==undefined&&r.crateOpening!==null&&r.crateOpening!==''?Number(r.crateOpening)||0:cratePrevious(p,d);return prev-Math.max(0,Number(r.crateCollected)||0)+crateDelivered(p,d)}
function crateInput(p,k){let r=rec(p),value=k==='prev'?(r.crateOpening??cratePrevious(p,S.date)):(r.crateCollected??0);return '<input class="crate-edit" type="number" min="0" step="1" value="'+esc(value)+'" '+(isFinalDateLocked()?'disabled':'')+' onchange="setCrateValue(\''+p.id+'\',\''+k+'\',this.value)">'}
function setCrateValue(id,k,v){if(isFinalDateLocked())return;let p=[...S.lines.flatMap(l=>l.customers||[]),...(S.suppliers||[])].find(x=>x.id===id);if(!p)return;let r=rec(p);r[k==='prev'?'crateOpening':'crateCollected']=Math.max(0,Math.floor(Number(v)||0));save();
 // Update only the calculated cell; rebuilding #host while an input is active closes the mobile keyboard.
 document.querySelectorAll('#host tr').forEach(tr=>{const inp=tr.querySelector('input.crate-edit');if(!inp||!inp.getAttribute('onchange')?.includes("'"+id+"'"))return;const out=tr.querySelector('td[data-k="crateNow"] b');if(out)out.textContent=crateBalance(p,S.date);});
 refreshOrderInputTotalsSoon();
}
function whatsappNumber(v){let n=String(v||'').replace(/[^\d+]/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('+'))n=n.slice(1);return /^\d{8,15}$/.test(n)?n:''}
function whatsappMessage(p){
 let m=masterFor(p),r=rec(p),d=(()=>{const [y,mo,day]=S.date.split('-');return day+'.'+mo+'. '+y})();
 let prev=Number(r.crateOpening??cratePrevious(p,S.date))||0;
 let collected=Number(r.crateCollected)||0,delivered=crateDelivered(p,S.date),balance=crateBalance(p,S.date);
 let parts=['◾*'+(m.nameFr||m.nameAr||p.nameFr||p.nameAr||'')+'*','◼️'+d,'-----------------------------'];
 [['small','🟥','Klein',15],['large','🟦','Groß',10],['brown','⬛','Dunkel',15],['tannour','🟧','Tandir',10]].forEach(([k,emoji,label,mult])=>{
   let q=Number(r[k])||0;
   if(q>0)parts.push(emoji+q+' *'+label+'* '+(q*mult));
 });
 parts.push('________________','◼️Kisten= '+prev+'-'+collected+'+'+delivered+'='+balance,'___________');
 let invoice=String(m.invoiceNo||'').trim(),manualRE=String(m.whatsappRE??'').trim();
 if(invoice||manualRE){
   parts.push('⭕*Rechnung :*');
   if(invoice)parts.push(invoice);
   if(manualRE)parts.push('RE='+manualRE);
 }
 parts.push('-----------------------------');
 return parts.join('\n');
}
function customerWhatsappTarget(p){let m=masterFor(p),n=whatsappNumber(m.phone||p.phone);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(whatsappMessage(p)):''}
function confirmCustomerWhatsapp(p){const m=masterFor(p),name=m.nameFr||m.nameAr||p.nameFr||p.nameAr||'الزبون';return window.confirm('هل تريد فتح واتساب للزبون:\n'+name+' ؟')}
function sendCustomerWhatsApp(id,line){let p=findPerson(id,'customer',line);if(!p)return;if(!confirmCustomerWhatsapp(p))return;let url=customerWhatsappTarget(p);if(!url){alert('رقم واتساب غير موجود أو غير صحيح. أدخله من بيانات الزبائن مع مفتاح الدولة.');return}window.open(url,'_blank','noopener')}

function sendAllWhatsApp(){waQueue=S.lines.flatMap(l=>l.customers||[]).filter(p=>masterFor(p).active!==false&&crateDelivered(p,S.date)>0&&customerWhatsappTarget(p));waPosition=0;if(!waQueue.length){alert('لا توجد طلبيات اليوم مع أرقام واتساب صالحة.');return}showNextWhatsapp()}

 let p=waQueue[waPosition],m=masterFor(p);modalBox.innerHTML='<h2>واتساب '+(waPosition+1)+' / '+waQueue.length+'</h2><p><b>'+esc(m.nameAr||m.nameFr||'')+'</b></p><pre style="white-space:pre-wrap;direction:ltr;background:#f3f6f8;padding:10px">'+esc(whatsappMessage(p))+'</pre><p>افتح المحادثة، وراجع الرسالة واضغط إرسال بنفسك، ثم ارجع واضغط التالي.</p><div class="actions"><button class="btn" onclick="closeModal()">إغلاق</button><button class="btn primary" onclick="openQueuedWhatsapp()">فتح واتساب</button><button class="btn" onclick="waPosition++;showNextWhatsapp()">التالي ←</button></div>';modal.classList.add('show')}
