@media print{

}

function recalculateSelectedHistory(){

 }

function supplierDayAccount(p,r){

 return ['small','large','brown','tannour'].reduce((sum,k)=>{

const OA_COLS=['Datum','Tag','stadt','Kunde','Klein','Groß','Dunkel','Tandir','Betrag','Bezahlung','Neuer Saldo','Preis Klein','Preis Groß','Preis Dunkel','Prix Tandir'];
let oaPrintSelection=OA_COLS.map((_,i)=>i).filter(i=>i<11);
function buildPrintColumns(){
 document.getElementById('oaPrintCols').innerHTML=OA_COLS.map((n,i)=>`<label><input type=checkbox ${oaPrintSelection.includes(i)?'checked':''} onchange="setPrintColumn(${i},this.checked)"> ${n}</label>`).join('')
}
function togglePrintColumns(){document.getElementById('oaPrintCols').classList.toggle('show')}
function setPrintColumn(i,on){
 if(on){if(!oaPrintSelection.includes(i))oaPrintSelection.push(i)}
 else oaPrintSelection=oaPrintSelection.filter(x=>x!==i);
 oaPrintSelection.sort((a,b)=>a-b)
}

let customerMonthlyPreview=null;
function statementPreviewSettings(){
 const f=statementFlow;if(!f)return '';
 return '<div dir="rtl" style="padding:9px;background:#edf5fc;border-radius:9px;margin:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
 '<label>المقاس <select id="spFormat" onchange="statementPreviewChange()"><option>A4</option><option>3:4</option><option>9:16</option></select></label>'+
 '<label>الهوامش <select id="spMargin" onchange="statementPreviewChange()"><option value="5">5%</option><option value="7">7%</option><option value="10">10%</option></select></label>'+
 '<label>الخط <select id="spFont" onchange="statementPreviewChange()"><option>16</option><option>18</option><option>20</option></select></label>'+
 '<label><input id="spBrand" type="checkbox" onchange="statementPreviewChange()"> إظهار ترويسة السلطان</label>'+
 '<label><input id="spEmpty" type="checkbox" onchange="statementPreviewChange()"> إخفاء الأعمدة الفارغة</label>'+
 '<details style="width:100%"><summary>اختيار الأعمدة</summary><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:4px">'+OA_COLS.map((name,i)=>'<label><input type="checkbox" data-stmt-col="'+i+'" onchange="statementPreviewColumnChange('+i+',this.checked)" '+(f.columns.includes(i)?'checked':'')+'> '+esc(name)+'</label>').join('')+'</div></details></div>';
}
function statementPreviewColumnChange(i,checked){
 const f=statementFlow;if(!f)return;
 if(!checked&&f.columns.length===1){alert('يجب إبقاء عمود واحد على الأقل');document.querySelector('[data-stmt-col="'+i+'"]').checked=true;return;}
 statementToggleColumn(i,checked);statementPreviewRender();
}
function statementPreviewSync(){
 const f=statementFlow;if(!f)return;
 for(const [id,value] of [['spFormat',f.format],['spMargin',String(f.margin)],['spFont',String(f.font)]]){const el=document.getElementById(id);if(el)el.value=value;}
 for(const [id,value] of [['spBrand',f.showBrand],['spEmpty',f.hideEmpty]]){const el=document.getElementById(id);if(el)el.checked=value;}
}
function statementPreviewChange(){
 if(!statementFlow)return;
 const f=statementFlow;
 f.format=document.getElementById('spFormat')?.value||f.format;
 f.margin=Number(document.getElementById('spMargin')?.value||f.margin);
 f.font=Number(document.getElementById('spFont')?.value||f.font);
 f.showBrand=!!document.getElementById('spBrand')?.checked;
 f.hideEmpty=!!document.getElementById('spEmpty')?.checked;
 statementPreviewRender();
}
function statementPreviewRender(){
 if(!statementFlow)return;
 const img=document.getElementById('statementLiveImage');
 const status=document.getElementById('statementLiveStatus');
 if(status)status.textContent='جارٍ تحديث المعاينة…';
 shareCustomerMonthlyImage(true,true).catch(e=>{if(status)status.textContent=String(e.message||e);});
}
function statementPreviewActions(){
 return '<div class="actions" style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:8px">'+
 '<button class="btn" onclick="statementShareTableImage()">مشاركة صورة</button>'+
 '<button class="btn" onclick="statementSharePDF()">مشاركة صفحة PDF</button>'+
 '<button class="btn" onclick="printStatementPreview()">طباعة</button>'+
 '<button class="btn" onclick="statementReturnToList()">رجوع</button></div>';

async function statementShareFile(blob,name,type){
 const file=new File([blob],name,{type});
 if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
  try{await navigator.share({files:[file],title:'Alsultan Brot'});return}catch(e){if(e?.name==='AbortError')return;}
 }
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
 alert('المشاركة غير متاحة في هذا المتصفح، تم تنزيل الملف بدلًا منها.');
}
async function statementShareTableImage(){
 // Share the COMPLETE statement (brand, client, table, totals and footer),
 // but crop unused vertical paper space and use smaller margins.
 const data=customerMonthlyPreview;if(!data?.canvas)return;
 const cv=data.canvas,rect=data.contentRect;
 const m=Math.round(cv.width*.055);
 const out=document.createElement('canvas');
 out.width=rect.w+2*m;out.height=rect.h+2*m;
 const c=out.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,out.width,out.height);
 c.drawImage(cv,rect.x,rect.y,rect.w,rect.h,m,m,rect.w,rect.h);
 const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));
 if(blob)await statementShareFile(blob,'Alsultan-Brot-statement.png','image/png');
}
function statementPDFBlob(canvas){
 // One-page PDF with the full rendered statement as a JPEG, fit inside A4.
 const jpeg=atob(canvas.toDataURL('image/jpeg',.92).split(',')[1]);
 const bytes=new Uint8Array(jpeg.length);for(let i=0;i<jpeg.length;i++)bytes[i]=jpeg.charCodeAt(i);
 const enc=new TextEncoder(),chunks=[],offsets=[0];let len=0;
 function push(x){const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length;}
 push('%PDF-1.4\n');
 function obj(n,body){offsets[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');}
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 offsets[4]=len;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n');
 const scale=Math.min(595.28/canvas.width,841.89/canvas.height),w=canvas.width*scale,h=canvas.height*scale;
 obj(5,'<< /Length '+('q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+((595.28-w)/2).toFixed(2)+' '+((841.89-h)/2).toFixed(2)+' cm /Im0 Do Q\n').length+' >>\nstream\nq '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+((595.28-w)/2).toFixed(2)+' '+((841.89-h)/2).toFixed(2)+' cm /Im0 Do Q\nendstream');
 const xref=len;push('xref\n0 6\n0000000000 65535 f \n');
 for(let i=1;i<=5;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'});
}
async function statementSharePDF(){
 const data=customerMonthlyPreview;if(!data?.canvas)return;
 await statementShareFile(statementPDFBlob(data.canvas),'Alsultan-Brot-statement.pdf','application/pdf');
}

}

function applyArchivePrintColumns(){
 const table=oaContent.querySelector('.customer-month-prices');if(!table)return;
 // Keep the source table intact; build a print-only table so colspan summary rows
 // do not shift the positions of the selected columns.
 const clone=table.cloneNode(true);
 const chosen=oaPrintSelection.slice().sort((a,b)=>a-b);
 clone.querySelectorAll('tr').forEach(tr=>{
  const original=[...tr.children],expanded=[];
  original.forEach(cell=>{const span=Math.max(1,Number(cell.getAttribute('colspan'))||1);for(let k=0;k<span;k++)expanded.push(k===0?cell.textContent.trim():'')});
  tr.innerHTML='';chosen.forEach(i=>{const el=document.createElement(tr.parentElement.tagName==='THEAD'?'th':'td');el.textContent=expanded[i]||'';if(tr.classList.contains('orders-paid')&&expanded[i].includes('Alter Saldo')){el.style.color='#d00000';el.style.fontWeight='900'}tr.appendChild(el)});
 });
 // Keep the summary visible across all selected columns without relying on old colspans.
 const body=clone.tBodies[0];
 if(body){
  [...body.rows].filter(r=>r.classList.contains('orders-paid')||r.classList.contains('orders-rest')).forEach(r=>{
   const srcRows=[...table.tBodies[0].rows];const src=srcRows[[...body.rows].indexOf(r)];
   if(!src)return;
   const cells=[...src.cells];const label=cells[0]?.textContent.trim()||'';
   const value=cells[1]?.textContent.trim()||'';
   r.innerHTML='';
   const labelCell=document.createElement('td');labelCell.textContent=label;labelCell.colSpan=Math.max(1,chosen.length-1);
   const valueCell=document.createElement('td');valueCell.textContent=value;
   if(chosen.length===1){labelCell.textContent=label+' : '+value;r.appendChild(labelCell)}
   else{r.append(labelCell,valueCell)}
   if(label.includes('Alter Saldo')){r.style.color='#d00000';r.style.fontWeight='900'}
  });
 }
 clone.id='oaPrintOnlyTable';
 // Fit the printable width while allocating space proportionally to actual column content.
 const columnCount=chosen.length;
 const measureCanvas=document.createElement('canvas');
 const measureCtx=measureCanvas.getContext('2d');
 measureCtx.font='bold 10px Arial';
 const weights=Array.from({length:columnCount},(_,i)=>{
  let longest=0;
  [...clone.rows].forEach(row=>{
   const cell=row.cells[i];
   if(!cell||cell.colSpan>1)return;
   longest=Math.max(longest,measureCtx.measureText((cell.textContent||'').trim()).width);
  });
  return Math.max(35,Math.min(310,longest+16));
 });
 const sum=weights.reduce((a,b)=>a+b,0)||1;
 const cg=document.createElement('colgroup');
 weights.forEach(w=>{const col=document.createElement('col');col.style.width=(100*w/sum).toFixed(4)+'%';cg.appendChild(col)});
 clone.insertBefore(cg,clone.firstChild);
 clone.style.width='100%';clone.style.maxWidth='100%';clone.style.tableLayout='fixed';
 table.style.display='none';table.insertAdjacentElement('afterend',clone);
}

 driverZoom=Math.max(.5,Math.min(3,Number(value)||.5));
 // Measure the real, unscaled content instead of the old frame's width.

  if(e.touches.length===2){startDistance=distance(e);startZoom=driverZoom;e.preventDefault()}
 },{passive:false});

  if(e.touches.length===2&&startDistance>0){setDriverZoom(startZoom*distance(e)/startDistance);e.preventDefault()}

function enableLiveTotals(){
 document.querySelectorAll('input[type="number"]').forEach(inp=>{
   // Crate fields must not trigger onchange on every keystroke: that rebuilds the table and closes Android's keyboard.
   if(inp.classList.contains('crate-edit'))return;
   if(inp.dataset.liveTotalsBound)return;
   inp.dataset.liveTotalsBound='1';
   inp.addEventListener('input',()=>{
     // Existing onchange logic is the source of truth; run it immediately while typing.
     if(typeof inp.onchange==='function')inp.onchange();
     else inp.dispatchEvent(new Event('change',{bubbles:true}));
   });
 });
}

// The previous-day balance is derived from chronological order history. A manual correction
// is stored as an explicit opening balance for that day, so later days recompute automatically.
function crateDay(p,d){let r=p.days?.[d];return r||null}
function crateDelivered(p,d){let r=crateDay(p,d);return r?['small','large','brown','tannour'].reduce((n,k)=>n+Math.max(0,Number(r[k])||0),0):0}
function cratePrevious(p,d){let dates=Object.keys(p.days||{}).filter(x=>x<d).sort();let balance=0;for(let x of dates){let r=p.days[x];if(r.crateOpening!==undefined&&r.crateOpening!==null&&r.crateOpening!=='')balance=Number(r.crateOpening)||0;balance-=Math.max(0,Number(r.crateCollected)||0);balance+=crateDelivered(p,x)}return balance}
function crateBalance(p,d){let r=crateDay(p,d)||{};let prev=r.crateOpening!==undefined&&r.crateOpening!==null&&r.crateOpening!==''?Number(r.crateOpening)||0:cratePrevious(p,d);return prev-Math.max(0,Number(r.crateCollected)||0)+crateDelivered(p,d)}
function crateInput(p,k){let r=rec(p),value=k==='prev'?(r.crateOpening??cratePrevious(p,S.date)):(r.crateCollected??0);return '<input class="crate-edit" type="number" min="0" step="1" value="'+esc(value)+'" '+(isFinalDateLocked()?'disabled':'')+' onchange="setCrateValue(\''+p.id+'\',\''+k+'\',this.value)">'}

 // Update only the calculated cell; rebuilding #host while an input is active closes the mobile keyboard.
 document.querySelectorAll('#host tr').forEach(tr=>{const inp=tr.querySelector('input.crate-edit');if(!inp||!inp.getAttribute('onchange')?.includes("'"+id+"'"))return;const out=tr.querySelector('td[data-k="crateNow"] b');if(out)out.textContent=crateBalance(p,S.date);});
 refreshOrderInputTotalsSoon();
}
function whatsappNumber(v){let n=String(v||'').replace(/[^\d+]/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('+'))n=n.slice(1);return /^\d{8,15}$/.test(n)?n:''}
function whatsappMessage(p){
 let m=masterFor(p),r=rec(p),d=(()=>{const [y,mo,day]=S.date.split('-');return day+'.'+mo+'. '+y})();
 let prev=Number(r.crateOpening??cratePrevious(p,S.date))||0;
 let collected=Number(r.crateCollected)||0,delivered=crateDelivered(p,S.date),balance=crateBalance(p,S.date);
 let parts=['◾*'+(m.nameFr||m.nameAr||p.nameFr||p.nameAr||'')+'*','◼️'+d,'-----------------------------'];
 [['small','🟥','Klein',15],['large','🟦','Groß',10],['brown','⬛','Dunkel',15],['tannour','🟧','Tandir',10]].forEach(([k,emoji,label,mult])=>{
   let q=Number(r[k])||0;
   if(q>0)parts.push(emoji+q+' *'+label+'* '+(q*mult));
 });
 parts.push('________________','◼️Kisten= '+prev+'-'+collected+'+'+delivered+'='+balance,'___________');
 let invoice=String(m.invoiceNo||'').trim(),manualRE=String(m.whatsappRE??'').trim();
 if(invoice||manualRE){
   parts.push('⭕*Rechnung :*');
   if(invoice)parts.push(invoice);
   if(manualRE)parts.push('RE='+manualRE);
 }
 parts.push('-----------------------------');
 return parts.join('\n');
}

 const lang=typeof currentLang==='function'?currentLang():'ar',t=L[lang]||L.ar;
 document.querySelectorAll('button').forEach(el=>{
  if(el.closest('#compactMainMenus,#languageChoiceV2,#printLanguageChoice,#printLangStep'))return;
  let original=tracked.get(el);
  if(original===undefined){original=el.textContent.trim();tracked.set(el,original)}
  const key=byOriginal[original];if(key&&el.textContent.trim()!==t[key])el.textContent=t[key];
 });
 const title=document.getElementById('deliveryDateTitle');if(title&&title.textContent.trim()!==t.date)title.textContent=t.date;
 document.querySelectorAll('#host th[data-k]').forEach(th=>{const key=th.dataset.k;if(t[key]&&th.textContent!==t[key])th.textContent=t[key]});
}
window.supplierCustomerMismatch=function(){
 const keys=['small','large','brown','tannour'];
 const customers=(S.lines||[]).flatMap(l=>l.customers||[]).filter(p=>!(p.masterId&&masterFor(p).active===false));
 const cz=sumsFor(customers),sz=sumsFor(S.suppliers||[]);
 return {different:keys.some(k=>(+cz[k]||0)!==(+sz[k]||0)),rows:keys.map(k=>({key:k,customers:+cz[k]||0,suppliers:+sz[k]||0,diff:(+cz[k]||0)-(+sz[k]||0)}))};
};
window.renderSupplyMismatchAlert=function(){
 document.getElementById('supplyMismatchAlert')?.remove();
 if(S.active!=='public')return;
 const result=supplierCustomerMismatch();if(!result.different)return;
 const t=L[typeof currentLang==='function'?currentLang():'ar']||L.ar;
 const box=document.createElement('div');box.id='supplyMismatchAlert';box.className='supply-mismatch-alert';
 const heading=document.createElement('strong');heading.textContent=t.warning;box.appendChild(heading);
 const table=document.createElement('table');
 const head=document.createElement('thead');const tr=document.createElement('tr');
 [t.type,t.customer,t.supplier,t.difference].forEach(label=>{const th=document.createElement('th');th.textContent=label;tr.appendChild(th)});head.appendChild(tr);table.appendChild(head);
 const tbody=document.createElement('tbody');
 result.rows.forEach(r=>{const row=document.createElement('tr');if(r.diff!==0)row.style.background='#fff0d8';
  [t[r.key],r.customers,r.suppliers,(r.diff>0?'+':'')+r.diff].forEach(value=>{const td=document.createElement('td');td.textContent=String(value);row.appendChild(td)});tbody.appendChild(row)});
 table.appendChild(tbody);box.appendChild(table);
 const summary=document.getElementById('summary');if(summary)summary.insertAdjacentElement('afterend',box);
};
const previousRender=window.render;
if(typeof previousRender==='function')window.render=function(){previousRender.apply(this,arguments);renderSupplyMismatchAlert();applyExtraLanguage()};
const previousChoose=window.chooseFullLanguage;
if(typeof previousChoose==='function')window.chooseFullLanguage=function(lang){previousChoose(lang);renderSupplyMismatchAlert();applyExtraLanguage()};
// Translate newly opened modal/archives without altering input values or user data.
document.addEventListener('click',()=>setTimeout(applyExtraLanguage,0));
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{applyExtraLanguage();renderSupplyMismatchAlert()});else{applyExtraLanguage();renderSupplyMismatchAlert()}
})();
</script>
